apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-server
  template:
    metadata:
      labels:
        app: aegis-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: aegis-server@sha256:REPLACE_AT_RELEASE
          ports:
            - containerPort: 8080
          env:
            - name: AEGIS_PUBLIC_MODE
              value: "true"
            - name: AEGIS_AUTH_MODE
              value: "api-key"
            - name: AEGIS_API_KEY_SHA256
              valueFrom:
                secretKeyRef:
                  name: aegis-server-auth
                  key: api-key-sha256
            - name: AEGIS_API_KEY_SCOPES
              value: "system:read"
            - name: AEGIS_REQUIRE_POSTGRES
              value: "true"
            - name: AEGIS_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: aegis-postgres
                  key: jdbc-url
            - name: AEGIS_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aegis-postgres
                  key: username
            - name: AEGIS_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegis-postgres
                  key: password
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /liveness
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
