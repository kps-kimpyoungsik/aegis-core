name: R1.11 Product API Auth Boundary

on:
  pull_request:
    paths:
      - 'product/apps/api-server/**'
      - 'product/tests/api-runtime.test.mjs'
      - '.github/workflows/r1.11-api-auth-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-auth-boundary:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Clean reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Canonical deterministic regression
        run: npm run verify:deterministic
      - name: Lint
        run: npm run lint
      - name: Release typecheck
        run: npm run typecheck:release
      - name: React production build
        run: npm run build:web
      - name: API authentication security regression
        run: npm run test:api-runtime
