name: R1.6 Product OCI Signature Boundary

on:
  pull_request:
    paths:
      - 'product/**'
      - '.github/workflows/r1.6-product-oci-signature.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-oci-signature:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Canonical product regression
        working-directory: product
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify:deterministic
          npm run lint
          npm run typecheck:release
          npm run build:web

      - name: Start ephemeral OCI registry
        run: |
          set -euo pipefail
          mkdir -p build/r1.6-oci-signature
          docker pull registry:3.1.1
          docker image inspect registry:3.1.1 --format '{{json .RepoDigests}}' \
            | tee build/r1.6-oci-signature/registry-image-digests.json
          docker run -d --rm --name aegis-r1-6-registry -p 5000:5000 registry:3.1.1
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs aegis-r1-6-registry
          exit 1

      - name: Build and push exact OCI candidate
        run: |
          set -euo pipefail
          IMAGE_TAG='localhost:5000/aegis/product:r1.6-candidate'
          docker build --pull --tag "${IMAGE_TAG}" ./product
          docker push "${IMAGE_TAG}"
          digest="$(curl --fail --silent --show-error --head \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "http://127.0.0.1:5000/v2/aegis/product/manifests/r1.6-candidate" \
            | awk -F': ' 'tolower($1)=="docker-content-digest" {gsub("\r", "", $2); print $2}')"
          test -n "${digest}"
          printf '%s\n' "${digest}" | tee build/r1.6-oci-signature/image-digest.txt
          printf '%s@%s\n' 'localhost:5000/aegis/product' "${digest}" \
            | tee build/r1.6-oci-signature/image-subject.txt

      - name: Install pinned Cosign 3.1.3
        run: |
          set -euo pipefail
          COSIGN_VERSION='3.1.3'
          COSIGN_SHA256='4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71'
          curl --fail --silent --show-error --location \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            --output /tmp/cosign
          printf '%s  %s\n' "${COSIGN_SHA256}" /tmp/cosign | sha256sum --check --strict
          chmod +x /tmp/cosign
          /tmp/cosign version | tee build/r1.6-oci-signature/cosign-version.txt

      - name: Create isolated CI signing keys and offline signing config
        env:
          COSIGN_PASSWORD: aegis-r1-6-ci-only
        run: |
          set -euo pipefail
          mkdir -p /tmp/aegis-signing-key /tmp/aegis-wrong-key
          (
            cd /tmp/aegis-signing-key
            /tmp/cosign generate-key-pair
          )
          (
            cd /tmp/aegis-wrong-key
            /tmp/cosign generate-key-pair
          )
          /tmp/cosign signing-config create \
            --no-default-fulcio \
            --no-default-oidc \
            --no-default-rekor \
            --no-default-tsa \
            --out build/r1.6-oci-signature/offline-signing-config.json
          test -s /tmp/aegis-signing-key/cosign.key
          test -s /tmp/aegis-signing-key/cosign.pub
          test -s /tmp/aegis-wrong-key/cosign.pub
          test -s build/r1.6-oci-signature/offline-signing-config.json
          sha256sum /tmp/aegis-signing-key/cosign.pub \
            | tee build/r1.6-oci-signature/public-key.sha256
          sha256sum /tmp/aegis-wrong-key/cosign.pub \
            | tee build/r1.6-oci-signature/wrong-public-key.sha256
          sha256sum build/r1.6-oci-signature/offline-signing-config.json \
            | tee build/r1.6-oci-signature/offline-signing-config.sha256

      - name: Sign exact OCI digest
        env:
          COSIGN_PASSWORD: aegis-r1-6-ci-only
        run: |
          set -euo pipefail
          IMAGE="$(cat build/r1.6-oci-signature/image-subject.txt)"
          /tmp/cosign sign --yes \
            --allow-http-registry \
            --new-bundle-format=true \
            --signing-config build/r1.6-oci-signature/offline-signing-config.json \
            --key /tmp/aegis-signing-key/cosign.key \
            "${IMAGE}"
          /tmp/cosign download signature --allow-http-registry "${IMAGE}" \
            > build/r1.6-oci-signature/signature.json
          test -s build/r1.6-oci-signature/signature.json

      - name: Verify correct key and reject wrong key
        run: |
          set -euo pipefail
          IMAGE="$(cat build/r1.6-oci-signature/image-subject.txt)"
          /tmp/cosign verify \
            --allow-http-registry \
            --insecure-ignore-tlog \
            --key /tmp/aegis-signing-key/cosign.pub \
            "${IMAGE}" \
            > build/r1.6-oci-signature/verification.json
          test -s build/r1.6-oci-signature/verification.json

          set +e
          /tmp/cosign verify \
            --allow-http-registry \
            --insecure-ignore-tlog \
            --key /tmp/aegis-wrong-key/cosign.pub \
            "${IMAGE}" \
            > build/r1.6-oci-signature/wrong-key.stdout 2> build/r1.6-oci-signature/wrong-key.stderr
          wrong_key_status=$?
          set -e
          test "${wrong_key_status}" -ne 0
          printf 'WRONG_KEY_REJECTION=PASS\n' \
            | tee build/r1.6-oci-signature/wrong-key-status.txt

      - name: Record boundary evidence
        run: |
          set -euo pipefail
          {
            echo 'R1_6_OCI_SIGNATURE_BOUNDARY=PASS'
            echo 'production_kms_custody=BLOCKED_BY_ENVIRONMENT'
            echo 'production_registry_signing=BLOCKED_BY_ENVIRONMENT'
            echo 'ci_ephemeral_key_persisted=false'
            echo 'transparency_log=NOT_APPLICABLE_TO_CI_SELF_MANAGED_KEY_MECHANICS'
            echo "commit=${GITHUB_SHA}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "docker=$(docker --version)"
          } > build/r1.6-oci-signature/environment.txt
          sha256sum \
            product/Dockerfile \
            product/package.json \
            product/package-lock.json \
            .github/workflows/r1.6-product-oci-signature.yml \
            > build/r1.6-oci-signature/source-sha256.txt

      - name: Upload OCI signature evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aegis-r1.6-oci-signature-evidence
          path: build/r1.6-oci-signature/**
          if-no-files-found: error
          retention-days: 30
