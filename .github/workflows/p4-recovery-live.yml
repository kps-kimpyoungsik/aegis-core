name: P4 Recovery Live Drill

on:
  pull_request:
    paths:
      - 'data-plane/**'
      - '.github/workflows/p4-recovery-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p4-recovery-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis-ci
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U aegis -d aegis"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify P4 core regressions
        run: bash data-plane/verify.sh

      - name: Initialize PostgreSQL schema
        env:
          PGPASSWORD: aegis-ci
        run: |
          psql -h 127.0.0.1 -p 54329 -U aegis -d aegis -v ON_ERROR_STOP=1 \
            -f data-plane/live-integration/sql/001_init.sql

      - name: Run backup restore projection recovery drill
        env:
          AEGIS_POSTGRES_PASSWORD: aegis-ci
          AEGIS_PG_HOST: 127.0.0.1
          AEGIS_PG_PORT: '54329'
          AEGIS_PG_DB: aegis
          AEGIS_PG_USER: aegis
        run: |
          mkdir -p data-plane/build/recovery-evidence
          bash data-plane/live-integration/scripts/test-postgres-recovery-live.sh \
            | tee data-plane/build/recovery-evidence/recovery-result.txt
          grep -Fx 'P4_RECOVERY_LIVE=PASS' data-plane/build/recovery-evidence/recovery-result.txt

      - name: Capture recovery evidence
        env:
          PGPASSWORD: aegis-ci
        run: |
          {
            echo "P4_RECOVERY_LIVE=PASS"
            echo "commit=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "postgres_image=postgres:16-alpine"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "psql=$(psql --version)"
            echo "pg_dump=$(pg_dump --version)"
            echo "pg_restore=$(pg_restore --version)"
          } > data-plane/build/recovery-evidence/environment.txt
          pg_isready -h 127.0.0.1 -p 54329 -U aegis \
            > data-plane/build/recovery-evidence/postgres-health.txt
          sha256sum \
            data-plane/live-integration/sql/001_init.sql \
            data-plane/live-integration/scripts/test-postgres-recovery-live.sh \
            > data-plane/build/recovery-evidence/source-sha256.txt

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v7
        with:
          name: p4-recovery-live-evidence
          path: data-plane/build/recovery-evidence/**
          if-no-files-found: error
          retention-days: 30
