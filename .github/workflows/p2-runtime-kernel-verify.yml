name: P2 Runtime Kernel Verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runtime-kernel/**"
      - ".github/workflows/p2-runtime-kernel-verify.yml"
  push:
    branches:
      - "workstream/p2-runtime-kernel-*"
    paths:
      - "runtime-kernel/**"
      - ".github/workflows/p2-runtime-kernel-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify Runtime Kernel
        working-directory: runtime-kernel
        run: bash verify.sh
      - name: Upload runtime kernel package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-runtime-kernel
          path: |
            runtime-kernel/build/dist/aegis-runtime-kernel-0.8.0.jar
            runtime-kernel/build/evidence/**
          if-no-files-found: error
          retention-days: 30
