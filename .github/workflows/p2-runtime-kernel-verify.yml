name: P2 Runtime Kernel Verify

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runtime-kernel/**"
      - ".github/workflows/p2-runtime-kernel-verify.yml"
  push:
    branches:
      - "workstream/p2-runtime-kernel-05-06"
    paths:
      - "runtime-kernel/**"
      - ".github/workflows/p2-runtime-kernel-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify P2-05 and P2-06
        working-directory: runtime-kernel
        run: bash verify.sh
      - name: Upload runtime kernel jar
        uses: actions/upload-artifact@v4
        with:
          name: aegis-runtime-kernel-validation-idempotency
          path: runtime-kernel/build/dist/aegis-runtime-kernel-validation-idempotency-0.1.0.jar
          if-no-files-found: error
