name: product-convergence

on:
  pull_request:
    paths:
      - "product/**"
      - ".github/workflows/product-convergence.yml"
  push:
    branches: ["main"]
    paths:
      - "product/**"
      - ".github/workflows/product-convergence.yml"

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Canonical deterministic verification
        run: npm run verify:deterministic

  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspace
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: React SPA production build
        run: npm run build:web
