name: rc3-session-convergence-verify
on:
  pull_request:
    paths:
      - 'release-candidates/rc3/**'
      - 'docs/canonical-source/**'
      - 'SESSION_CONVERGENCE_MANIFEST.md'
  workflow_dispatch:

jobs:
  rc3-java-and-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release-candidates/rc3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x scripts/*.sh
      - run: ./scripts/lint.sh
      - run: ./scripts/test.sh
      - run: ./scripts/package.sh
      - run: ./scripts/security-smoke.sh
      - run: ./scripts/deployment-static-test.sh

  rc3-frontend-reproducibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: release-candidates/rc3/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require committed dependency lock
        run: test -f package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
